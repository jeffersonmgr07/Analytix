<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytix | La forma inteligente de administrar datos</title>
  <meta name="description" content="Analytix te ayuda a digitalizar tu negocio con soluciones basadas en datos: desarrollo web, apps, software a medida, SEO y marketing digital." />

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-dark: #050816;
      --bg-section: #0b1020;
      --accent: #4f46e5;
      --accent-soft: rgba(79, 70, 229, 0.15);
      --accent-alt: #22c55e;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --border-subtle: rgba(156, 163, 175, 0.3);
      --radius-xl: 1.5rem;
      --shadow-soft: 0 24px 60px rgba(15, 23, 42, 0.6);
      --max-width: 1080px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top, #1f2937 0, #020617 45%, #020617 100%);
      color: var(--text-main);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    /* Layout base */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(18px);
      background: radial-gradient(circle at top, rgba(15,23,42,0.98), rgba(15,23,42,0.92));
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
    }

    .navbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1.5rem;
      max-width: var(--max-width);
      margin: 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      background: conic-gradient(from 210deg, #22c55e, #4f46e5, #06b6d4, #22c55e);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 18px rgba(56,189,248,0.9);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .brand-text-main {
      font-weight: 600;
      letter-spacing: 0.12em;
      font-size: 0.9rem;
      text-transform: uppercase;
    }

    .brand-text-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      font-size: 0.9rem;
    }

    .nav-links a {
      position: relative;
      color: var(--text-muted);
      font-weight: 400;
    }

    .nav-links a:hover,
    .nav-links a:focus {
      color: #e5e7eb;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -0.25rem;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-alt));
      border-radius: 999px;
      transition: width 0.2s ease;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-cta {
      padding: 0.45rem 0.95rem;
      border-radius: 999px;
      border: 1px solid rgba(129, 140, 248, 0.7);
      font-size: 0.8rem;
      font-weight: 500;
      background: radial-gradient(circle at top left, rgba(129,140,248,0.3), rgba(15,23,42,0.9));
      box-shadow: 0 0 0 1px rgba(148, 163, 184, 0.15);
    }

    .nav-cta:hover {
      border-color: rgba(94, 234, 212, 0.9);
      box-shadow: 0 0 0 1px rgba(94, 234, 212, 0.5);
    }

    /* Mobile nav */
    .nav-toggle {
      display: none;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: rgba(15, 23, 42, 0.9);
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .nav-toggle span {
      display: block;
      width: 16px;
      height: 2px;
      background: #e5e7eb;
      border-radius: 999px;
      position: relative;
    }

    .nav-toggle span::before,
    .nav-toggle span::after {
      content: "";
      position: absolute;
      left: 0;
      width: 16px;
      height: 2px;
      border-radius: 999px;
      background: #e5e7eb;
    }

    .nav-toggle span::before {
      top: -5px;
    }

    .nav-toggle span::after {
      bottom: -5px;
    }

    .nav-links-mobile {
      display: none;
      flex-direction: column;
      gap: 0.75rem;
      padding: 0.75rem 1.5rem 1.1rem;
      border-top: 1px solid rgba(148, 163, 184, 0.2);
      background: radial-gradient(circle at top, #020617, #020617);
      font-size: 0.9rem;
    }

    .nav-links-mobile a {
      color: var(--text-muted);
    }

    .nav-links-mobile a:hover {
      color: #e5e7eb;
    }

    /* Hero */
    .hero {
      padding: 4rem 0 4.5rem;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: -40%;
      background:
        radial-gradient(circle at 0 0, rgba(56,189,248,0.1), transparent 55%),
        radial-gradient(circle at 100% 20%, rgba(129,140,248,0.16), transparent 55%),
        radial-gradient(circle at 50% 100%, rgba(16,185,129,0.18), transparent 55%);
      opacity: 0.9;
      pointer-events: none;
    }

    .hero-inner {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      gap: 2.5rem;
      align-items: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.12rem 0.6rem 0.15rem;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: rgba(15,23,42,0.7);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
      margin-bottom: 0.9rem;
    }

    .eyebrow-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, #a7f3d0, #22c55e);
      box-shadow: 0 0 10px rgba(52,211,153,0.9);
    }

    .hero-title {
      font-size: clamp(2.2rem, 3.3vw + 1.3rem, 3.2rem);
      line-height: 1.1;
      letter-spacing: -0.035em;
      margin-bottom: 1rem;
    }

    .hero-title span {
      background: linear-gradient(120deg, #a5b4fc, #22c55e, #38bdf8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-subtitle {
      color: var(--text-muted);
      max-width: 31rem;
      font-size: 0.98rem;
      margin-bottom: 1.7rem;
    }

    .hero-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.8rem;
    }

    .hero-badge {
      font-size: 0.75rem;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      background: rgba(15,23,42,0.9);
      border: 1px solid rgba(148, 163, 184, 0.35);
      color: var(--text-muted);
    }

    .hero-cta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .btn-primary,
    .btn-ghost {
      outline: none;
      border-radius: 999px;
      padding: 0.7rem 1.4rem;
      font-size: 0.9rem;
      font-weight: 500;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #22c55e);
      box-shadow: 0 18px 45px rgba(79, 70, 229, 0.55);
      color: #f9fafb;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 22px 60px rgba(79, 70, 229, 0.7);
    }

    .btn-ghost {
      border-color: rgba(148, 163, 184, 0.7);
      background: rgba(15,23,42,0.85);
      color: var(--text-muted);
    }

    .btn-ghost:hover {
      border-color: rgba(94,234,212,0.9);
      color: #e5e7eb;
    }

    .btn-icon {
      font-size: 1rem;
    }

    .hero-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .hero-meta span {
      color: #a5b4fc;
      font-weight: 500;
    }

    /* Hero visual */
    .hero-visual {
      position: relative;
      isolation: isolate;
    }

    .hero-card {
      position: relative;
      border-radius: calc(var(--radius-xl) * 1.1);
      padding: 1.3rem 1.3rem 1.1rem;
      background: radial-gradient(circle at top, rgba(15,23,42,0.9), rgba(15,23,42,1));
      border: 1px solid rgba(148, 163, 184, 0.35);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }

    .hero-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      gap: 1rem;
    }

    .hero-card-title {
      font-size: 0.85rem;
      font-weight: 500;
    }

    .hero-card-pill {
      font-size: 0.7rem;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid rgba(129, 140, 248, 0.7);
      color: #c7d2fe;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .hero-card-pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #4ade80;
      box-shadow: 0 0 12px rgba(74, 222, 128, 0.9);
    }

    .hero-metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.8rem;
      margin-bottom: 1.2rem;
      font-size: 0.78rem;
    }

    .metric-card {
      padding: 0.7rem 0.75rem;
      border-radius: 0.9rem;
      background: radial-gradient(circle at top left, rgba(37,99,235,0.36), rgba(15,23,42,1));
      border: 1px solid rgba(148, 163, 184, 0.45);
    }

    .metric-label {
      color: var(--text-muted);
      margin-bottom: 0.1rem;
    }

    .metric-value {
      font-weight: 600;
      font-size: 1rem;
    }

    .metric-trend {
      font-size: 0.7rem;
      color: #22c55e;
    }

    .metric-trend.down {
      color: #fb7185;
    }

    .hero-chart {
      margin: 0.3rem -0.3rem 0;
      padding-top: 0.7rem;
      border-top: 1px dashed rgba(55, 65, 81, 0.8);
      display: flex;
      align-items: flex-end;
      gap: 0.25rem;
      height: 80px;
    }

    .hero-bar {
      flex: 1;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(96,165,250,0.9), rgba(30,64,175,0.1));
      opacity: 0.7;
    }

    .hero-bar:nth-child(3),
    .hero-bar:nth-child(5) {
      background: linear-gradient(180deg, rgba(52,211,153,1), rgba(22,101,52,0.15));
      opacity: 1;
    }

    .hero-bar:nth-child(1) { height: 35%; }
    .hero-bar:nth-child(2) { height: 55%; }
    .hero-bar:nth-child(3) { height: 75%; }
    .hero-bar:nth-child(4) { height: 50%; }
    .hero-bar:nth-child(5) { height: 90%; }
    .hero-bar:nth-child(6) { height: 60%; }

    .hero-floating {
      position: absolute;
      bottom: -0.4rem;
      right: -0.1rem;
      transform: translate(0, 100%);
      animation: floatWidget 9s ease-in-out infinite;
      animation-delay: 0.6s;
    }

    .hero-widget {
      padding: 0.6rem 0.9rem;
      border-radius: 999px;
      background: rgba(15,23,42,0.95);
      border: 1px solid rgba(148, 163, 184, 0.5);
      box-shadow: 0 16px 40px rgba(15,23,42,0.85);
      font-size: 0.72rem;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      white-space: nowrap;
    }

    .hero-widget-pill {
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(74,222,128,0.8);
      color: #bbf7d0;
      font-size: 0.68rem;
    }

    @keyframes floatWidget {
      0%, 100% {
        transform: translate(-10px, 0);
        opacity: 0.85;
      }
      50% {
        transform: translate(10px, -8px);
        opacity: 1;
      }
    }

    /* Secciones genéricas */
    section {
      padding: 3.5rem 0;
    }

    .section-header {
      text-align: center;
      margin-bottom: 2.3rem;
    }

    .section-kicker {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .section-title {
      font-size: 1.8rem;
      letter-spacing: -0.03em;
      margin-bottom: 0.55rem;
    }

    .section-description {
      max-width: 32rem;
      margin: 0.25rem auto 0;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Quiénes somos */
    .about {
      background: radial-gradient(circle at top, rgba(15,23,42,0.9), rgba(2,6,23,1));
    }

    .about-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      gap: 2.2rem;
      align-items: center;
    }

    .about-text h3 {
      font-size: 1.2rem;
      margin-bottom: 0.9rem;
    }

    .about-text p {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 0.8rem;
    }

    .about-list {
      list-style: none;
      margin-top: 0.5rem;
      display: grid;
      gap: 0.3rem;
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    .about-list li::before {
      content: "▹";
      margin-right: 0.4rem;
      color: #a5b4fc;
    }

    .about-pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .about-pill {
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      border: 1px dashed rgba(148, 163, 184, 0.6);
      color: var(--text-muted);
    }

    .about-card {
      border-radius: var(--radius-xl);
      background: radial-gradient(circle at top left, rgba(8,47,73,0.7), rgba(15,23,42,1));
      border: 1px solid rgba(148, 163, 184, 0.4);
      padding: 1.3rem 1.3rem 1rem;
      box-shadow: var(--shadow-soft);
      font-size: 0.85rem;
    }

    .about-card-title {
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 0.7rem;
    }

    .about-card-cols {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.8rem;
      margin-top: 0.7rem;
    }

    .about-mini {
      border-radius: 0.9rem;
      padding: 0.7rem 0.75rem;
      background: rgba(15,23,42,0.9);
      border: 1px solid rgba(148, 163, 184, 0.4);
      font-size: 0.8rem;
    }

    .about-mini strong {
      display: block;
      margin-bottom: 0.2rem;
      font-size: 0.78rem;
      color: #c4b5fd;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Cómo funciona / beneficios */
    .how {
      background: radial-gradient(circle at top, rgba(15,23,42,0.9), rgba(15,23,42,1));
      border-top: 1px solid rgba(31, 41, 55, 0.9);
      border-bottom: 1px solid rgba(31, 41, 55, 0.9);
    }

    .how-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      gap: 2rem;
      align-items: flex-start;
    }

    .steps {
      display: grid;
      gap: 1rem;
    }

    .step {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 0.9rem;
      align-items: flex-start;
      padding: 0.75rem 0.3rem;
    }

    .step-index {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 600;
      background: radial-gradient(circle at top left, rgba(79,70,229,1), rgba(37,99,235,0.5));
      box-shadow: 0 0 16px rgba(79,70,229,0.9);
    }

    .step-title {
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 0.15rem;
    }

    .step-body {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.6rem;
      font-size: 0.75rem;
    }

    .pill {
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      color: var(--text-muted);
    }

    .benefits {
      border-radius: var(--radius-xl);
      background: radial-gradient(circle at top left, rgba(55,65,81,0.9), rgba(15,23,42,1));
      border: 1px solid rgba(75,85,99,0.9);
      padding: 1.3rem 1.3rem 1.1rem;
      box-shadow: var(--shadow-soft);
    }

    .benefits-title {
      font-size: 1rem;
      margin-bottom: 0.4rem;
    }

    .benefits-sub {
      font-size: 0.86rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .benefits-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.8rem;
      font-size: 0.83rem;
    }

    .benefit-item {
      border-radius: 0.85rem;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: rgba(15,23,42,0.9);
      padding: 0.7rem 0.75rem;
    }

    .benefit-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 0.15rem;
    }

    .benefit-value {
      font-weight: 600;
    }

    /* Testimonios */
    .testimonials {
      background: radial-gradient(circle at top, rgba(15,23,42,0.9), #020617);
    }

    .testimonial-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1.3rem;
    }

    .testimonial {
      border-radius: var(--radius-xl);
      background: rgba(15,23,42,0.95);
      border: 1px solid rgba(148, 163, 184, 0.4);
      padding: 1.1rem 1.1rem 1rem;
      font-size: 0.85rem;
      box-shadow: 0 20px 50px rgba(15,23,42,0.7);
      position: relative;
      overflow: hidden;
    }

    .testimonial::before {
      content: "“";
      position: absolute;
      top: -0.5rem;
      right: 0.75rem;
      font-size: 3rem;
      color: rgba(75, 85, 99, 0.4);
      font-family: Georgia, "Times New Roman", serif;
    }

    .testimonial-body {
      color: var(--text-muted);
      margin-bottom: 0.9rem;
    }

    .testimonial-author {
      font-weight: 500;
      font-size: 0.86rem;
    }

    .testimonial-role {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* Request demo */
    .demo {
      background: radial-gradient(circle at top, rgba(15,23,42,0.9), #020617);
      border-top: 1px solid rgba(31, 41, 55, 0.9);
    }

    .demo-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      gap: 2rem;
      align-items: center;
    }

    .demo-copy h3 {
      font-size: 1.25rem;
      margin-bottom: 0.6rem;
    }

    .demo-copy p {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
    }

    .demo-points {
      list-style: none;
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .demo-points li {
      margin-bottom: 0.3rem;
    }

    .demo-points li::before {
      content: "✓";
      margin-right: 0.4rem;
      color: #22c55e;
    }

    .demo-form {
      border-radius: var(--radius-xl);
      background: rgba(15,23,42,0.95);
      border: 1px solid rgba(148, 163, 184, 0.4);
      padding: 1.3rem 1.3rem 1.1rem;
      box-shadow: var(--shadow-soft);
      font-size: 0.88rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.8rem;
      margin-bottom: 0.8rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      margin-bottom: 0.8rem;
    }

    label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    input,
    textarea {
      border-radius: 0.8rem;
      border: 1px solid rgba(75, 85, 99, 0.9);
      padding: 0.45rem 0.7rem;
      background: rgba(15,23,42,0.9);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }

    input::placeholder,
    textarea::placeholder {
      color: #6b7280;
    }

    input:focus,
    textarea:focus {
      border-color: rgba(129, 140, 248, 0.95);
      box-shadow: 0 0 0 1px rgba(129, 140, 248, 0.6);
      background: rgba(15,23,42,1);
    }

    textarea {
      resize: vertical;
      min-height: 90px;
      max-height: 200px;
    }

    .form-note {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }

      border-top: 1px solid rgba(15, 23, 42, 1);
      padding: 1.7rem 0 1.8rem;
      background: #020617;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .footer-inner {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
    }

    .footer-contact {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .footer-contact a {
      color: #e5e7eb;
      font-weight: 400;
    }

    .footer-meta {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      text-align: right;
    }

    .footer-meta span {
      display: inline-block;
    }
